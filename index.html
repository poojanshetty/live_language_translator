<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Translator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .container {
        max-width: 600px;
        width: 100%;
        text-align: center;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    select, button {
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
    }
    button {
        cursor: pointer;
        background-color: #007BFF;
        color: white;
    }
    button:hover {
        background-color: #0056b3;
    }
    .output {
        margin-top: 20px;
        text-align: left;
    }
    .output p {
        margin: 5px 0;
    }

</style>
</head>
<body>
    <div class="container">
        <h1>Speech Translator</h1>
        <label for="language-selector">Select Target Language:</label>
        <select id="language-selector">
            <!-- Options will be populated dynamically -->
        </select>
        <button id="record-button">🎤 Start Recording</button>
        <div class="output">
            <p><strong>Detected Language:</strong> <span id="detected-lang">-</span></p>
            <p><strong>Translated Text:</strong> <span id="translated-text">-</span></p>
        </div>
        <button id="play-audio" style="display: none;">▶️ Play Translation</button>
    </div>

    <script>
        const supportedLanguages = {
        'af': 'Afrikaans',
        'sq': 'Albanian',
        'am': 'Amharic',
        'ar': 'Arabic',
        'hy': 'Armenian',
        'as': 'Assamese',
        'ay': 'Aymara',
        'az': 'Azerbaijani',
        'bm': 'Bambara',
        'eu': 'Basque',
        'be': 'Belarusian',
        'bn': 'Bengali',
        'bho': 'Bhojpuri',
        'bs': 'Bosnian',
        'bg': 'Bulgarian',
        'ca': 'Catalan',
        'ceb': 'Cebuano',
        'zh-CN': 'Chinese (Simplified)',
        'zh-TW': 'Chinese (Traditional)',
        'co': 'Corsican',
        'hr': 'Croatian',
        'cs': 'Czech',
        'da': 'Danish',
        'dv': 'Dhivehi',
        'doi': 'Dogri',
        'nl': 'Dutch',
        'en': 'English',
        'eo': 'Esperanto',
        'et': 'Estonian',
        'ee': 'Ewe',
        'fil': 'Filipino (Tagalog)',
        'fi': 'Finnish',
        'fr': 'French',
        'fy': 'Frisian',
        'gl': 'Galician',
        'ka': 'Georgian',
        'de': 'German',
        'el': 'Greek',
        'gn': 'Guarani',
        'gu': 'Gujarati',
        'ht': 'Haitian Creole',
        'ha': 'Hausa',
        'haw': 'Hawaiian',
        'he': 'Hebrew',
        'hi': 'Hindi',
        'hmn': 'Hmong',
        'hu': 'Hungarian',
        'is': 'Icelandic',
        'ig': 'Igbo',
        'ilo': 'Ilocano',
        'id': 'Indonesian',
        'ga': 'Irish',
        'it': 'Italian',
        'ja': 'Japanese',
        'jv': 'Javanese',
        'kn': 'Kannada',
        'kk': 'Kazakh',
        'km': 'Khmer',
        'rw': 'Kinyarwanda',
        'gom': 'Konkani',
        'ko': 'Korean',
        'kri': 'Krio',
        'ku': 'Kurdish',
        'ckb': 'Kurdish (Sorani)',
        'ky': 'Kyrgyz',
        'lo': 'Lao',
        'la': 'Latin',
        'lv': 'Latvian',
        'ln': 'Lingala',
        'lt': 'Lithuanian',
        'lg': 'Luganda',
        'lb': 'Luxembourgish',
        'mk': 'Macedonian',
        'mai': 'Maithili',
        'mg': 'Malagasy',
        'ms': 'Malay',
        'ml': 'Malayalam',
        'mt': 'Maltese',
        'mi': 'Maori',
        'mr': 'Marathi',
        'mni-Mtei': 'Meiteilon (Manipuri)',
        'lus': 'Mizo',
        'mn': 'Mongolian',
        'my': 'Myanmar (Burmese)',
        'ne': 'Nepali',
        'no': 'Norwegian',
        'ny': 'Nyanja (Chichewa)',
        'or': 'Odia (Oriya)',
        'om': 'Oromo',
        'ps': 'Pashto',
        'fa': 'Persian',
        'pl': 'Polish',
        'pt': 'Portuguese',
        'pa': 'Punjabi',
        'qu': 'Quechua',
        'ro': 'Romanian',
        'ru': 'Russian',
        'sm': 'Samoan',
        'sa': 'Sanskrit',
        'gd': 'Scots Gaelic',
        'nso': 'Sepedi',
        'sr': 'Serbian',
        'st': 'Sesotho',
        'sn': 'Shona',
        'sd': 'Sindhi',
        'si': 'Sinhala (Sinhalese)',
        'sk': 'Slovak',
        'sl': 'Slovenian',
        'so': 'Somali',
        'es': 'Spanish',
        'su': 'Sundanese',
        'sw': 'Swahili',
        'sv': 'Swedish',
        'tl': 'Tagalog (Filipino)',
        'tg': 'Tajik',
        'ta': 'Tamil',
        'tt': 'Tatar',
        'te': 'Telugu',
        'th': 'Thai',
        'ti': 'Tigrinya',
        'ts': 'Tsonga',
        'tr': 'Turkish',
        'tk': 'Turkmen',
        'ak': 'Twi (Akan)',
        'uk': 'Ukrainian',
        'ur': 'Urdu',
        'ug': 'Uyghur',
        'uz': 'Uzbek',
        'vi': 'Vietnamese',
        'cy': 'Welsh',
        'xh': 'Xhosa',
        'yi': 'Yiddish',
        'yo': 'Yoruba',
        'zu': 'Zulu'
        };

        const languageSelector = document.getElementById('language-selector');
        const recordButton = document.getElementById('record-button');
        const detectedLangElem = document.getElementById('detected-lang');
        const translatedTextElem = document.getElementById('translated-text');
        const playAudioButton = document.getElementById('play-audio');

        let targetLanguage = 'en'; // Default target language
        let audioBlob = null;

        // Populate dropdown
        for (const [code, name] of Object.entries(supportedLanguages)) {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = `${name} (${code})`;
            languageSelector.appendChild(option);
        }

        languageSelector.addEventListener('change', (e) => {
            targetLanguage = e.target.value;
        });

        async function captureAudio() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const recorder = new MediaRecorder(stream);
            const chunks = [];

            return new Promise((resolve, reject) => {
                recorder.ondataavailable = (event) => chunks.push(event.data);
                recorder.onstop = () => resolve(new Blob(chunks, { type: 'audio/webm' }));
                recorder.onerror = (event) => reject(event.error);

                recorder.start();
                setTimeout(() => recorder.stop(), 5000); // Record for 5 seconds
            });
        }

        recordButton.addEventListener('click', async () => {
            recordButton.textContent = '🎤 Recording...';
            try {
                // Capture audio
                const audio = await captureAudio();

                // Send to backend for speech recognition
                const formData = new FormData();
                formData.append('audio', audio);
                const recognitionResponse = await fetch('http://localhost:5000/recognize', {
                    method: 'POST',
                    body: formData
                });
                const { text } = await recognitionResponse.json();

                // Detect language
                const detectionResponse = await fetch('http://localhost:5000/detect-language', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const { language } = await detectionResponse.json();

                // Translate text
                const translationResponse = await fetch('http://localhost:5000/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, target_language: targetLanguage })
                });
                const { translated_text } = await translationResponse.json();

                // Update UI
                detectedLangElem.textContent = supportedLanguages[language];
                translatedTextElem.textContent = translated_text;

                // Generate TTS
                const ttsResponse = await fetch('http://localhost:5000/text-to-speech', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: translated_text, language: targetLanguage })
                });
                const { audio_url } = await ttsResponse.json();

                // Fetch the audio file
                audioBlob = await fetch(audio_url).then(res => res.blob());
                playAudioButton.style.display = 'inline-block';

            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during speech translation.');
            } finally {
                recordButton.textContent = '🎤 Start Recording';
            }
        });

        playAudioButton.addEventListener('click', () => {
            if (audioBlob) {
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play();
            }
        });
    </script>
</body>
</html>
